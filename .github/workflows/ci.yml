name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-python:
    runs-on: ubuntu-latest
    outputs:
      min-version: ${{ steps.resolve.outputs.min }}
      max-version: ${{ steps.resolve.outputs.max }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          # One CPython job: the newest 3.x that actions/setup-python offers
          # on the current ubuntu-latest image. A floating 3.x spec follows
          # the runner when ubuntu-latest moves. Do not also schedule the
          # requires-python floor. Ubuntu 26.04 does not publish CPython 3.9,
          # so setup-python fails with:
          #   The version '3.9' with architecture 'x64' was not found for Ubuntu 26.04.
          version = '3.x'
          print(f'min={version}')
          print(f'max={version}')
          print(f'matrix={json.dumps([version])}')
          PYEOF

  lint:
    needs: resolve-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.resolve-python.outputs.max-version }}

      - run: uv sync --frozen --extra dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  test:
    needs: resolve-python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.resolve-python.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --frozen --extra dev

      - run: uv run pytest -v
