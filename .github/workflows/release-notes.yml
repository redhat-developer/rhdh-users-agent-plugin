name: Release notes

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: release-notes
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    # Scheduled refreshes only belong to the canonical repository. Forks can still
    # dispatch manually, and need no secrets of their own.
    if: github.event_name == 'workflow_dispatch' || github.repository == 'redhat-developer/rhdh-users-agent-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          enable-cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - run: uv sync --frozen --extra release-notes

      - name: Regenerate bundled release notes
        run: |
          uv run python skills/rhdh-upgrade-helper/scripts/generate-release-notes.py --all

      - id: diff
        run: |
          # git diff ignores untracked files, and a newly published release is a new file.
          notes="skills/rhdh-upgrade-helper/references/release-notes"
          if [ -z "$(git status --porcelain -- "$notes")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- "$notes"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_NOTES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          branch="bot/release-notes"
          notes="skills/rhdh-upgrade-helper/references/release-notes"
          title="docs(rhdh-upgrade-helper): refresh RHDH release notes"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "$notes"

          # Skip the whole step when the reusable branch already proposes this content.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --no-tags origin "$branch:refs/remotes/origin/$branch"
            if git diff --quiet --cached "refs/remotes/origin/$branch" -- "$notes"; then
              echo "::notice::$branch already carries these notes; nothing to propose."
              exit 0
            fi
          fi

          # Reusing this branch updates an existing PR. Branch protection must dismiss
          # stale approvals whenever these generated commits change.
          git switch -c "$branch"
          git commit -s -m "$title"
          git push -u --force-with-lease origin "$branch"

          {
            echo "Regenerated the bundled RHDH release notes from the official Red Hat documentation."
            echo
            echo "Changed files:"
            echo
            echo '```'
            git show --stat --oneline HEAD | tail -n +2
            echo '```'
            echo
            echo "Generated by .github/workflows/release-notes.yml. Review the wording and merge; do not edit these files by hand."
            echo "This branch can be updated by later runs, so review the latest commit and confirm stale approvals were dismissed."
          } > /tmp/pr-body.md

          # Match by title so pull requests opened from older run-id branches are found too.
          existing=$(gh pr list --state open --search "in:title \"$title\"" \
            --json number,headRefName,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository == false) | select(.headRefName | startswith("bot/release-notes"))] | .[0].number // empty')

          if [ -n "$existing" ] && [ "$(gh pr view "$existing" --json headRefName --jq .headRefName)" = "$branch" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$existing" -F body=@/tmp/pr-body.md >/dev/null
            echo "::notice::Updated the open release-notes pull request #$existing."
            exit 0
          fi

          if ! url=$(gh pr create --base main --head "$branch" --title "$title" --body-file /tmp/pr-body.md); then
            echo "::error::Could not open the pull request. Enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General > Workflow permissions, or add a RELEASE_NOTES_TOKEN secret with contents: write and pull-requests: write."
            exit 1
          fi

          if [ -n "$existing" ]; then
            gh pr close "$existing" --delete-branch \
              --comment "Superseded by $url, which uses the reusable \`$branch\` branch so only one release-notes pull request is open at a time."
          fi
          echo "Opened $url"
